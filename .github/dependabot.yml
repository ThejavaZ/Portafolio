version: 2
updates:
  # Dependencias del sitio (pnpm, package.json en /portafolio)
  - package-ecosystem: "npm"
    directory: "/portafolio"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    versioning-strategy: "increase-if-necessary"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # Actions usados en el CI
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
